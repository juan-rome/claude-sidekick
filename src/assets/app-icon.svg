  </defs>
  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#bg)" />
  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#vignette)" />
  <ellipse cx="100" cy="173" rx="44" ry="7" fill="url(#shadow)" />

